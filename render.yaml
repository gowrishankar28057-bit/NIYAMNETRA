# Render.com blueprint — one web service (API + built SPA, same origin) + PostgreSQL.
# Deploy: push this repo to GitHub, then in Render choose "New > Blueprint" and point
# it at the repo. Render reads this file and provisions both resources.
services:
  - type: web
    name: neyamnetra
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: REPORTING_PERIOD_START
        value: "2026-07-01"
      - key: DATABASE_URL
        fromDatabase:
          name: neyamnetra-db
          property: connectionString

databases:
  - name: neyamnetra-db
    plan: free
    postgresMajorVersion: "17"
