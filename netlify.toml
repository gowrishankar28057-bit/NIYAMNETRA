# Netlify config — hosts the NeyamNetra FRONTEND only.
#
# Netlify cannot run this project's Python/Flask backend (OpenCV, PyMuPDF,
# SQLAlchemy, PostgreSQL, server-side sessions). Deploy the backend separately
# (e.g. Render via render.yaml) and point the proxy below at it, so the browser
# only ever talks to the Netlify origin and session cookies stay first-party.
#
# ONE thing to edit after the backend is live:
#   replace https://REPLACE-WITH-YOUR-BACKEND.onrender.com with your backend URL.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Leave the API base empty so the SPA calls /api on its own origin; Netlify
  # proxies those requests to the backend via the redirect below.
  VITE_API_BASE = ""

# Proxy API + document file/preview endpoints to the backend (status 200 = proxy,
# not a redirect — keeps the request first-party from the browser's view).
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: every other path serves the built index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
